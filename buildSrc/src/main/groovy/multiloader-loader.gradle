plugins {
    id 'multiloader-common'
    id "org.jetbrains.kotlin.jvm"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonKotlin {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
    // Another namespace's jars with their data generators still in, which the shipped ones no longer
    // carry. Kept off implementation and runtimeOnly on purpose: runtimeElements does not extend
    // this, so the published metadata stays free of it and only the dev runs, which resolve
    // runtimeClasspath, ever see these.
    devRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

configurations.runtimeClasspath.extendsFrom(configurations.devRuntime)

dependencies {
    def namespace = project.path.substring(1).takeBefore(':')
    def common = ":$namespace:common"
    compileOnly(project(common)) {
        capabilities {
            requireCapability "$group:$modId"
        }
    }
    commonJava project(path: common, configuration: 'commonJava')
    commonKotlin project(path: common, configuration: 'commonKotlin')
    commonResources project(path: common, configuration: 'commonResources')
}

ext.subprojectInclude = { String basePath ->
    def commonProject = project("${basePath}:common")
    def baseGroup = commonProject.group
    def baseModId = commonProject.property("modId")
    dependencies {
        compileOnly(project("${basePath}:common")) {
            capabilities {
                requireCapability("$baseGroup:$baseModId")
            }
        }
        implementation(project(path: "${basePath}:fabric")) {
            capabilities {
                requireCapability("$baseGroup:$baseModId-fabric")
            }
        }
    }
}

ext.subprojectFabric = ext.subprojectInclude

ext.subprojectNeoforge = { String basePath ->
    def commonProject = project("${basePath}:common")
    def baseGroup = commonProject.group
    def baseModId = commonProject.property("modId")
    dependencies {
        compileOnly(project("${basePath}:neoforge")) {
            capabilities {
                requireCapability("$baseGroup:$baseModId-neoforge")
            }
        }
        compileOnly(project("${basePath}:common")) {
            capabilities {
                requireCapability("$baseGroup:$baseModId-common")
            }
        }
        // The runtime side deliberately takes devJar rather than the ordinary runtimeElements jar,
        // which has had its data generators stripped out. This classpath is only ever a dev run's -
        // in a real game each mod is its own jar, and each declares the other in its mod metadata.
        devRuntime project(path: "${basePath}:neoforge", configuration: 'devElements')
        devRuntime project(path: "${basePath}:common", configuration: 'devElements')
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('compileKotlin') {
    dependsOn(configurations.commonKotlin)
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    source(configurations.commonKotlin)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonKotlin)
    from(configurations.commonKotlin)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

dokka {
    dokkaSourceSets.configureEach {
        sourceRoots.from(
                configurations.commonJava,
                configurations.commonKotlin
        )
    }
}

tasks.named("dokkaGenerate") {
    dependsOn(configurations.commonJava)
    dependsOn(configurations.commonKotlin)
}

